# XcodeGen project description. The cloud build turns this into an Xcode project.
name: HeyHelper
options:
  bundleIdPrefix: app.heyhelper
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  HeyHelper:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - Resources
    dependencies:
      - framework: Frameworks/llama.xcframework
        embed: true
      - target: PipLockScreen
    info:
      path: Support/App-Info.plist
      properties:
        CFBundleDisplayName: Helper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: Helper listens for "Hey Helper" and your questions. Audio never leaves your iPhone.
        NSSpeechRecognitionUsageDescription: Helper turns your voice into text right on your iPhone so it can understand you.
        NSContactsUsageDescription: Helper looks up a contact when you ask it to call or text someone.
        NSAppleMusicUsageDescription: Helper can play, pause and skip your music when you ask.
        NSCameraUsageDescription: Helper uses the camera light as a flashlight when you ask.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.heyhelper.pip
        PRODUCT_NAME: HeyHelper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PipLockScreen:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Support/Widget-Info.plist
      properties:
        CFBundleDisplayName: Pip
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.heyhelper.pip.lockscreen
        PRODUCT_NAME: PipLockScreen
        SKIP_INSTALL: YES
schemes:
  HeyHelper:
    build:
      targets:
        HeyHelper: all
        PipLockScreen: all
    run:
      config: Debug
    archive:
      config: Release
